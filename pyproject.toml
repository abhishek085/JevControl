[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevcontrol"
version = "0.2.0"
description = "Measure what a System One decision model saves on YOUR agent harness - same tasks, same accuracy check, decision steps swapped - entirely on local models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.5",
  "pyyaml>=6",
  "numpy>=1.26",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
jevcontrol = "jevcontrol.cli:main"

[tool.setuptools.packages.find]
include = ["jevcontrol*"]

[tool.setuptools.package-data]
jevcontrol = ["webui/**/*", "demo/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
